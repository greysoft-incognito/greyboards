name: Set up EAS
description: Installs the mobile app's dependencies and, for EAS builds, the EAS CLI, and passes the build settings to the build.

inputs:
  expo-token:
    description: Expo access token, needed by the eas and runner builders
    default: ''
  builder:
    description: eas (EAS servers), runner (EAS local build on this runner) or gradle (expo prebuild and Gradle on this runner, no EAS)
    default: eas
  eas-project-id:
    description: EAS project ID. Left empty, the project is created, or found by the app's slug, with the token
    default: ''
  eas-owner:
    description: Expo account that owns the EAS project
    default: ''
  api-url:
    description: Public API address the app talks to
    required: true
  web-url:
    description: Public web app address, used for app links
    default: ''
  app-version:
    description: Version name the app is built with. Left empty, app.json's version is used
    default: ''
  build-number:
    description: Build number (Android versionCode, iOS buildNumber). Left empty, app.json's is used
    default: ''
  android-architectures:
    description: CPU architectures native code is compiled for on runner builds
    default: armeabi-v7a,arm64-v8a,x86,x86_64

runs:
  using: composite
  steps:
    - name: Check settings
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        API_URL: ${{ inputs.api-url }}
        BUILDER: ${{ inputs.builder }}
      run: |
        missing=""
        [ -n "$EXPO_TOKEN" ] || [ "$BUILDER" = "gradle" ] || missing="$missing EXPO_TOKEN(secret)"
        [ -n "$API_URL" ] || missing="$missing API_URL(variable)"

        if [ -n "$missing" ]; then
          echo "Missing repository settings:$missing" >&2
          exit 1
        fi

    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile --filter '@greyboards/mobile...'

    - if: inputs.builder != 'eas'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - if: inputs.builder != 'eas'
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.cache/ccache
        key: android-build-${{ runner.os }}-${{ inputs.android-architectures }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
        restore-keys: |
          android-build-${{ runner.os }}-${{ inputs.android-architectures }}-
          android-build-${{ runner.os }}-

    - if: inputs.builder != 'eas'
      name: Tune runner builds
      shell: bash
      env:
        ANDROID_ARCHITECTURES: ${{ inputs.android-architectures }}
        BUILDER: ${{ inputs.builder }}
      run: |
        sudo apt-get install -y --no-install-recommends ccache > /dev/null

        workdir="$RUNNER_TEMP/eas-build"
        [ "$BUILDER" != "gradle" ] || workdir="$GITHUB_WORKSPACE"

        {
          echo "GRADLE_OPTS=-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.project.reactNativeArchitectures=$ANDROID_ARCHITECTURES"
          echo "EAS_LOCAL_BUILD_WORKINGDIR=$workdir"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_BASEDIR=$workdir"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_MAXSIZE=2G"
        } >> "$GITHUB_ENV"

    - if: inputs.builder != 'gradle'
      uses: expo/expo-github-action@v9
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}

    # Without EAS_PROJECT_ID, create the EAS project (or find the one this account already
    # has for the app's slug) with the token, so nobody has to run `eas init` on their machine.
    - name: Find or create the EAS project
      if: inputs.builder != 'gradle'
      id: project
      shell: bash
      working-directory: apps/mobile
      env:
        EAS_PROJECT_ID: ${{ inputs.eas-project-id }}
        EAS_OWNER: ${{ inputs.eas-owner }}
      run: |
        if [ -n "$EAS_PROJECT_ID" ]; then
          echo "id=$EAS_PROJECT_ID" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -n "$EAS_OWNER" ]; then
          jq --arg owner "$EAS_OWNER" '.expo.owner = $owner' app.json > app.tmp.json
          mv app.tmp.json app.json
        fi

        # eas init can only write the id into a static app.json, so set app.config.ts aside while it runs.
        mv app.config.ts "$RUNNER_TEMP/app.config.ts"
        eas init --non-interactive --force
        mv "$RUNNER_TEMP/app.config.ts" app.config.ts

        id="$(jq -r '.expo.extra.eas.projectId // empty' app.json)"

        if [ -z "$id" ]; then
          echo "Couldn't create or find the EAS project. Check that EXPO_TOKEN belongs to the account in EAS_OWNER." >&2
          exit 1
        fi

        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "::notice title=EAS project::Using EAS project $id. Save it as the EAS_PROJECT_ID repository variable to skip this step next time."

    - name: Pass build settings to EAS
      shell: bash
      working-directory: apps/mobile
      env:
        EAS_PROJECT_ID: ${{ steps.project.outputs.id || inputs.eas-project-id }}
        EAS_OWNER: ${{ inputs.eas-owner }}
        API_URL: ${{ inputs.api-url }}
        WEB_URL: ${{ inputs.web-url }}
        APP_VERSION: ${{ inputs.app-version }}
        APP_BUILD_NUMBER: ${{ inputs.build-number }}
      run: |
        jq --arg id "$EAS_PROJECT_ID" --arg owner "$EAS_OWNER" --arg api "$API_URL" --arg web "$WEB_URL" \
          --arg version "$APP_VERSION" --arg build "$APP_BUILD_NUMBER" \
          '.build.base.env = ({ EXPO_PUBLIC_API_URL: $api }
            + (if $id != "" then { EAS_PROJECT_ID: $id } else {} end)
            + (if $owner != "" then { EAS_OWNER: $owner } else {} end)
            + (if $web != "" then { EXPO_PUBLIC_WEB_URL: $web } else {} end)
            + (if $version != "" then { APP_VERSION: $version } else {} end)
            + (if $build != "" then { APP_BUILD_NUMBER: $build } else {} end))' \
          eas.json > eas.tmp.json
        mv eas.tmp.json eas.json

        {
          echo "EXPO_PUBLIC_API_URL=$API_URL"
          [ -z "$EAS_PROJECT_ID" ] || echo "EAS_PROJECT_ID=$EAS_PROJECT_ID"
          [ -z "$EAS_OWNER" ] || echo "EAS_OWNER=$EAS_OWNER"
          [ -z "$WEB_URL" ] || echo "EXPO_PUBLIC_WEB_URL=$WEB_URL"
          [ -z "$APP_VERSION" ] || echo "APP_VERSION=$APP_VERSION"
          [ -z "$APP_BUILD_NUMBER" ] || echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER"
        } >> "$GITHUB_ENV"
