name: Deploy API

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the selected branch, or roll back to the release before the current one
        type: choice
        options: [deploy, rollback]
        default: deploy
      skip_migrations:
        description: Skip database migrations
        type: boolean
        default: false
      run_checks:
        description: Typecheck and test the API before deploying
        type: boolean
        default: true
      keep_releases:
        description: Number of releases to keep on the server
        type: string
        default: '5'

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH || '/var/www/greyboards-api' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && inputs.run_checks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greyboards
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '@greyboards/api...'
      - run: pnpm --filter @greyboards/api typecheck
      - name: Test API
        working-directory: apps/api
        run: |
          cp .env.example .env
          pnpm exec ark migrate
          pnpm test

  deploy:
    needs: check
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: api-production
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh ~/.local/bin
          chmod 700 ~/.ssh

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi

          cat > ~/.ssh/config <<EOF
          Host api
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            ServerAliveInterval 30
          EOF

          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            printf '  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          elif [ -z "$SSHPASS" ]; then
            echo "Set the SSH_PASSWORD or SSH_KEY secret." >&2
            exit 1
          fi

          # Answers ssh's password prompt from SSHPASS, so password logins need no extra tools.
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSHPASS"\n' > ~/.local/bin/ssh-askpass

          # `remote` runs a command on the server with whichever credential is set.
          cat > ~/.local/bin/remote <<'EOF'
          #!/usr/bin/env bash
          if [ -n "$SSHPASS" ] && [ ! -f ~/.ssh/deploy_key ]; then
            export SSH_ASKPASS="$HOME/.local/bin/ssh-askpass" SSH_ASKPASS_REQUIRE=force
            exec ssh -o PreferredAuthentications=password,keyboard-interactive api "$@"
          fi
          exec ssh api "$@"
          EOF
          chmod +x ~/.local/bin/remote ~/.local/bin/ssh-askpass
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload settings
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
        env:
          API_DOTENV: ${{ secrets.API_DOTENV }}
        run: |
          if [ -n "$API_DOTENV" ]; then
            printf '%s\n' "$API_DOTENV" | remote "mkdir -p '$DEPLOY_PATH/shared' && umask 077 && cat > '$DEPLOY_PATH/shared/.env'"
          fi

      - name: Upload release
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
        id: release
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "name=$release" >> "$GITHUB_OUTPUT"

          git archive --format=tar.gz -o release.tar.gz HEAD \
            package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc tsconfig.base.json \
            packages apps/api apps/web/package.json apps/mobile/package.json

          remote "mkdir -p '$DEPLOY_PATH/releases' && cat > '$DEPLOY_PATH/releases/$release.tar.gz'" < release.tar.gz

      - name: Deploy
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
        env:
          RELEASE: ${{ steps.release.outputs.name }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations || false }}
          KEEP_RELEASES: ${{ inputs.keep_releases || '5' }}
          PM2_NAME: ${{ vars.API_PM2_NAME || 'greyboards-api' }}
          RESTART_COMMAND: ${{ vars.API_RESTART_COMMAND }}
        run: |
          remote "$(printf 'DEPLOY_PATH=%q SKIP_MIGRATIONS=%q KEEP_RELEASES=%q PM2_NAME=%q RESTART_COMMAND=%q bash -ls -- deploy %q' \
            "$DEPLOY_PATH" "$SKIP_MIGRATIONS" "$KEEP_RELEASES" "$PM2_NAME" "$RESTART_COMMAND" "$RELEASE")" \
            < .github/scripts/deploy-api.sh

      - name: Roll back
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        env:
          PM2_NAME: ${{ vars.API_PM2_NAME || 'greyboards-api' }}
          RESTART_COMMAND: ${{ vars.API_RESTART_COMMAND }}
        run: |
          remote "$(printf 'DEPLOY_PATH=%q PM2_NAME=%q RESTART_COMMAND=%q bash -ls -- rollback' \
            "$DEPLOY_PATH" "$PM2_NAME" "$RESTART_COMMAND")" \
            < .github/scripts/deploy-api.sh

      - name: Check the public URL
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$API_URL" > /dev/null
