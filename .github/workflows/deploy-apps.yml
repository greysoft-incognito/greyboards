name: Deploy apps

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      deploy_web:
        description: Deploy the web app to Cloudflare Workers
        type: boolean
        default: true

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    if: github.event_name == 'push' || inputs.deploy_web
    runs-on: ubuntu-latest
    environment: web-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '@greyboards/web...'
      - run: pnpm --filter @greyboards/web typecheck
      - run: pnpm --filter @greyboards/web build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set the API_URL repository variable to the public API address." >&2
            exit 1
          fi

          pnpm exec wrangler deploy --var "API_URL:$API_URL"
